# ==============================================================
# nginx.conf — Reverse Proxy Hermes Agent Multi-Agente
# GENERADO AUTOMÁTICAMENTE — NO EDITAR MANUALMENTE
# Editar: scripts/generate-nginx-conf.sh.template o profiles/
#
# Rutas:
#   /v1/*           → hermes-leader (alias principal)
#   /leader/*       → hermes-leader:8642
#   /coder/*        → hermes-coder:8642
#   /researcher/*   → hermes-researcher:8642
#   /assistant/*    → hermes-assistant:8642
#   /reviewer/*     → hermes-reviewer:8642
#   /dashboard/*    → hermes-leader:9119 (dashboard)
#   /nginx-health   → liveness del proxy
# ==============================================================

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    proxy_read_timeout    600s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    upstream hermes_assistant {
        server hermes-assistant:8642;
        keepalive 8;
    }
    upstream hermes_coder {
        server hermes-coder:8642;
        keepalive 8;
    }
    upstream hermes_leader {
        server hermes-leader:8642;
        keepalive 16;
    }
    upstream hermes_net {
        server hermes-net:8642;
        keepalive 8;
    }
    upstream hermes_researcher {
        server hermes-researcher:8642;
        keepalive 8;
    }
    upstream hermes_reviewer {
        server hermes-reviewer:8642;
        keepalive 8;
    }
    upstream hermes_leader_dashboard {
        server hermes-leader:9119;
        keepalive 4;
    }
    server {
        listen 80;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Assistant
        location /assistant/ {
            rewrite ^/assistant/(.*)$ /$1 break;
            proxy_pass http://hermes_assistant;
            proxy_buffering off;
            proxy_cache    off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # Coder
        location /coder/ {
            rewrite ^/coder/(.*)$ /$1 break;
            proxy_pass http://hermes_coder;
            proxy_buffering off;
            proxy_cache    off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # Leader (API principal — alias /v1 y /leader)
        location /v1/ {
            proxy_pass http://hermes_leader/v1/;
            proxy_buffering off;
            proxy_cache    off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location /leader/ {
            rewrite ^/leader/(.*)$ /$1 break;
            proxy_pass http://hermes_leader;
            proxy_buffering off;
            proxy_cache    off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # Net
        location /net/ {
            rewrite ^/net/(.*)$ /$1 break;
            proxy_pass http://hermes_net;
            proxy_buffering off;
            proxy_cache    off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # Researcher
        location /researcher/ {
            rewrite ^/researcher/(.*)$ /$1 break;
            proxy_pass http://hermes_researcher;
            proxy_buffering off;
            proxy_cache    off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # Reviewer
        location /reviewer/ {
            rewrite ^/reviewer/(.*)$ /$1 break;
            proxy_pass http://hermes_reviewer;
            proxy_buffering off;
            proxy_cache    off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }
        # Dashboard (WebSocket)
        location /dashboard/ {
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass http://hermes_leader_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
