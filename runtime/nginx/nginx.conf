# ============================================================
# nginx.conf — Reverse Proxy para Hermes Agent Multi-Perfil
# Rutas:
#   /              → hermes-default API (8642)
#   /default/      → hermes-default API
#   /coder/        → hermes-coder API
#   /researcher/   → hermes-researcher API
#   /assistant/    → hermes-assistant API
#   /dashboard/    → hermes-default Dashboard (9119)
# ============================================================

events {
    worker_connections 1024;
}

http {
    # ── Logging ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Configuración general ───────────────────────────────
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # ── Timeouts para llamadas de larga duración (streaming) ─
    proxy_read_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;

    # ── Headers comunes a todos los upstreams ──────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Upstreams ───────────────────────────────────────────
    upstream hermes_default {
        server hermes-default:8642;
        keepalive 16;
    }

    upstream hermes_coder {
        server hermes-coder:8642;
        keepalive 16;
    }

    upstream hermes_researcher {
        server hermes-researcher:8642;
        keepalive 16;
    }

    upstream hermes_assistant {
        server hermes-assistant:8642;
        keepalive 16;
    }

    upstream hermes_default_dash {
        server hermes-default:9119;
        keepalive 4;
    }

    # ── Servidor HTTP principal ─────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health endpoint del proxy
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Agente Default (raíz) ──────────────────────────
        location / {
            proxy_pass http://hermes_default;
            # SSE / streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location /default/ {
            rewrite ^/default/(.*)$ /$1 break;
            proxy_pass http://hermes_default;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Agente Coder ───────────────────────────────────
        location /coder/ {
            rewrite ^/coder/(.*)$ /$1 break;
            proxy_pass http://hermes_coder;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Agente Researcher ──────────────────────────────
        location /researcher/ {
            rewrite ^/researcher/(.*)$ /$1 break;
            proxy_pass http://hermes_researcher;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Agente Assistant ───────────────────────────────
        location /assistant/ {
            rewrite ^/assistant/(.*)$ /$1 break;
            proxy_pass http://hermes_assistant;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Dashboards ─────────────────────────────────────
        location /dashboard/ {
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass http://hermes_default_dash;
            # WebSocket support para TUI dashboard
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
