  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
  acked_advisories: []
  allow_lazy_installs: true
cron:
  wrap_response: true
  max_parallel_jobs: null
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  orchestrator_profile: ''
  default_assignee: ''
  auto_decompose: true
  auto_decompose_per_tick: 3
code_execution:
  mode: project
logging:
  level: WARNING
  max_size_mb: 10
  backup_count: 2
  memory_monitor:
    enabled: false
    interval_seconds: 300
model_catalog:
  enabled: true
  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
  ttl_hours: 24
  providers: {}
network:
  force_ipv4: true
sessions:
  auto_prune: true
  retention_days: 30
  vacuum_after_prune: true
  min_interval_hours: 24
onboarding:
  seen: {}
updates:
  pre_update_backup: false
  backup_keep: 5
lsp:
  enabled: true
  wait_mode: document
  wait_timeout: 5
  install_strategy: auto
  servers: {}
x_search:
  model: grok-4.20-reasoning
  timeout_seconds: 180
  retries: 2
mcp_servers:
  backbone-doc-resource:
    args:
    - -y
    - tsx
    - ${HOME_USER}/Mcp/Backbone/src/server.ts
    command: npx
  bash:
    args:
    - bash-mcp
    command: npx
    env:
      BASH_MCP_MAX_OUTPUT_SIZE: '102400'
      BASH_MCP_TEMP_DIR: ${HOME_USER}/Downloads
  chrome-devtools:
    args:
    - -y
    - chrome-devtools-mcp@latest
    - --slim
    - --headless
    command: npx
  context7:
    args:
    - context7 uses streamable-http - configured via headers inHermes
    command: echo
    headers:
      Authorization: Bearer ${CONTEXT7_API_KEY}
    url: https://mcp.context7.com/mcp
  filesystem:
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - ${HOME_USER}/proyectos/
    - ${HOME_USER}/Downloads
    command: npx
  github:
    args:
    - -y
    - '@modelcontextprotocol/server-github'
    command: npx
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
  memory:
    args:
    - -y
    - '@modelcontextprotocol/server-memory'
    command: npx
    env:
      MEMORY_FILE_PATH: ${HOME_USER}/Mcp/memory.json
